      - { kind: ics, url: "https://calendar.google.com/calendar/ical/b00109f5c3955e833d48084091f907abcd75987942c55fcd527385cdf1ba7cb5%40group.calendar.google.com/public/basic.ics", org: "Oakland Tenants Union", default_type: kyr }
      - { kind: ics, url: "https://lapena.org/events/?ical=1", org: "La Peña Cultural Center", default_type: show }
      - { kind: mobilize, org_id: 32784, default_type: action, near_zips: ["945", "946", "947", "948"] }  # Indivisible East Bay (resistance/GOTV, Tri-Valley-heavy)
      # Electoral/resistance 2026-08-11 (per user — local resistance chapters only).
      # Swing Left (159) REMOVED: it's a Democratic GOTV aggregator whose events are
      # sponsored by state Dem parties (CA Dem Party, WisDems) — pulls in exactly the
      # Dem-party content the user excluded, and floods with national canvassing.
      - { kind: mobilize, org_id: 42967, default_type: action }   # Eden Area Indivisible (Castro Valley/Hayward, own-local)
      - { kind: mobilize, org_id: 47687, default_type: action }   # Together We Will Albany Berkeley (own-local)
    # Skipped: 350 Bay Area (ics) — regional (EB+SF+Benicia), no zip data to filter,
    #   would duplicate across cities. Critical Resistance (ics) — after Oakland-only
    #   filter it's 12 near-identical "Prisoner Mail Nights", repetitive filler.
    #   would duplicate across cities. Sunrise (mobilize 2425) — 0 East Bay after 945-948 filter.

