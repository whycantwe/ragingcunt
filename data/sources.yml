# ═══════════════════════════════════════════════════════════════════════════
# ragingcunt.com — EVENT SOURCES
# This is the ONE file you maintain. Add a city or a feed here and the Sunday
# job pulls from everything listed and rebuilds data/events.json.
#
# Each city = a label + a list of `sources`. Two kinds work out of the box
# (see scripts/build.py):
#   - { kind: ics,      url: "<.ics feed>", org: "Name", default_type: tenant }
#   - { kind: mobilize, org_id: 12345,       default_type: action }
#
# default_type is applied to a feed's events unless the fetcher infers better.
# TYPES: action | meeting | mutualaid | show | teachin | tenant | kyr
#
# HOW TO FIND FEEDS
#   • WordPress + "The Events Calendar" sites usually expose an ICS at
#       <site>/events/?ical=1     (or look for a "Subscribe / iCal" link)
#   • Google Calendar: Settings ▸ Integrate calendar ▸ "Public iCal address"
#   • Mobilize org_id: open the org's mobilize.us page; the id is in the URL/API
#
# RULE: only add feeds that actually exist and return events. An empty city is
# an honest empty issue — the site never invents listings to fill a gap.
# ═══════════════════════════════════════════════════════════════════════════

cities:
  sacramento:
    label: "Sacramento, CA"
    # Verified 2026-08-07: each feed fetched and confirmed to return real
    # events. ICS entries are public calendar exports (%40 = @). default_type is
    # a per-feed fallback; Mobilize refines type per-event from its event_type.
    sources:
      - { kind: ics, url: "https://calendar.google.com/calendar/ical/dsasacramento%40gmail.com/public/basic.ics", org: "Sacramento DSA", default_type: meeting }
      - { kind: ics, url: "https://calendar.google.com/calendar/ical/c_182554b64da4c175a456432c76c4287b3aef3af1110a8abf58792ef0a36a9a44%40group.calendar.google.com/public/basic.ics", org: "NorCal Resist", default_type: mutualaid }
      - { kind: ics, url: "https://calendar.google.com/calendar/ical/sacvalleytenants%40gmail.com/public/basic.ics", org: "Sacramento Valley Tenants Union", default_type: tenant }
      # Added 2026-08-07 to diversify the mix (climate, LGBTQ+, street actions):
      - { kind: ics, url: "https://calendar.google.com/calendar/ical/events%40350sacramento.org/public/basic.ics", org: "350 Sacramento", default_type: action }
      - { kind: ics, url: "https://saccenter.org/events/?ical=1", org: "Sacramento LGBT Community Center", default_type: meeting }
      # Indivisible El Dorado cross-posts a national coalition firehose (147+
      # "Coalition Against Project 2025" events); near_zips keeps only its
      # Sacramento-metro events (956xx = inner suburbs, 958xx = city/south Sac).
      - { kind: mobilize, org_id: 40479, default_type: action, near_zips: ["956", "958"] }
      # Added 2026-08-07 (Black economic-empowerment programming — job/skills/
      # homeownership workshops; community uplift, tagged teachin):
      - { kind: ics, url: "https://www.gsul.org/events/?ical=1", org: "Greater Sacramento Urban League", default_type: teachin }
      # Added 2026-08-07 (labor — fills a gap; low volume now but a real local body):
      - { kind: mobilize, org_id: 40215, default_type: meeting }   # Sacramento Central Labor Council (its own feed, local — no near_zips needed)
    # Rejected / not added (kept here so they're not "rediscovered" as new):
    #   - Reproductive rights: NO local org publishes a fetchable feed (PP Mar Monte
    #     has none; national PP Mobilize org 157 returns 0 Sacramento events). Gap.
    #   - Sierra Club Sacramento (meetup ics): only recreational day hikes, one in SF.
    #   - Sacramento Area Bicycle Advocates (google ics): 30 VEVENTs but ~1 upcoming.
    #   - Wellstone Progressive Democrats (google ics): electoral Dem-club meetings.
    #   - March for Our Lives Sacramento: Facebook-only, no feed.
    #   - Sacramento Native American Health Center (ics https://snahc.org/events/?ical=1):
    #     valid feed but it's a health CLINIC's patient-care calendar (CBT/therapy
    #     groups, addiction recovery, a "Closed Meeting", same-day behavioral clinic)
    #     — sensitive, non-organizing, and would swamp the wall (30 cards). Not a fit.
    #   - Indivisible Sacramento (mobilize 34947): national firehose (IL zips, CDT Zooms).
    #   - States Win Sacramento (mobilize 6496): near-identical duplicate of 40479 — skip.
    #   - Indivisible Yolo (mobilize 4362): 29 events but all Woodland/Davis/West Sac
    #     (Yolo county, not Sacramento) — save for a future Davis/Yolo city.
    #   - Women's March Sacramento (mobilize 6363): valid feed, 0 upcoming.
    #   - Sacramento Area Peace Action: The Events Calendar exists but ?ical=1 returns
    #     HTML, not raw ICS (cache/export blocked) — revisit if they expose a real feed.

  oakland:       { label: "Oakland, CA",       sources: [] }
  los-angeles:   { label: "Los Angeles, CA",   sources: [] }
  san-francisco: { label: "San Francisco, CA", sources: [] }
  san-diego:     { label: "San Diego, CA",     sources: [] }
  san-jose:      { label: "San Jose, CA",      sources: [] }
  long-beach:    { label: "Long Beach, CA",    sources: [] }
  fresno:        { label: "Fresno, CA",        sources: [] }
  santa-cruz:    { label: "Santa Cruz, CA",    sources: [] }
  riverside:     { label: "Riverside, CA",     sources: [] }
