name: weekly-build

# Rebuilds data/events.json from the feeds in data/sources.yml and commits it.
# The static site (index.html) just reads that file, so committing = publishing.

on:
  schedule:
    # Sundays 14:00 UTC (~6–7am US Pacific). GitHub cron can lag under load; fine weekly.
    - cron: "0 14 * * 0"
  workflow_dispatch: {}   # lets you click "Run workflow" to build on demand (use this first)

# REQUIRED so the job can commit events.json back to the repo.
# Also flip Settings ▸ Actions ▸ General ▸ Workflow permissions ▸ "Read and write".
permissions:
  contents: write
  issues: write   # feed watchdog opens/closes a GitHub issue when a feed dies

concurrency:
  group: weekly-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Build events.json
        env:
          # Add API keys here as repo secrets (Settings ▸ Secrets ▸ Actions) and
          # read them in build.py via os.environ. Public ICS/Mobilize need none.
          ACTION_NETWORK_TOKEN: ${{ secrets.ACTION_NETWORK_TOKEN }}
        run: python scripts/build.py

      - name: Commit if changed
        run: |
          git config user.name  "rage-bot"
          git config user.email "rage-bot@users.noreply.github.com"
          # events.json is the data; build.py also bakes SSR HTML + JSON-LD into
          # index.html, generates a crawlable page per city (<city>/index.html), and
          # refreshes sitemap.xml for SEO — commit data + every generated page.
          # feed-health.json is the watchdog's memory (miss streaks per feed) —
          # commit it too, or the streak resets every run and decay never trips.
          git add -A data/events.json data/feed-health.json index.html sitemap.xml "*/index.html" "*.ics"
          if git diff --staged --quiet; then
            echo "No changes this week."
          else
            git commit -m "weekly: refresh events $(date -u +%F)"
            git push
          fi

      - name: Feed watchdog (ping only if a feed goes dark)
        if: always()
        continue-on-error: true   # a gh hiccup must never block publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/feed_health_alert.py
